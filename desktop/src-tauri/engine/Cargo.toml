[package]
name = "cam-engine"
version = "1.2.1"
description = "Claude 多账号管理的核心逻辑（不依赖 Tauri）"
edition = "2021"
rust-version = "1.89"

[lib]
name = "cam_engine"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2.10", features = ["json"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
whoami = "1"
hostname = "0.4"
ruzstd = "0.9.1"
aes-gcm = "0.10.3"
pbkdf2 = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
url = "2"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.16"

[dev-dependencies]
tiny_http = "0.12"
