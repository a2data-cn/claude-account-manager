name: build

# 每次推送、每个 PR：跑三套测试（脚本版在三个系统上、Rust 引擎、桌面版前端）。
# 推送 v* 标签或手动点“Run workflow”：再编三个系统的桌面版安装包。标签构建生成 Release 草稿，
# 手动构建的安装包放在这次运行的 Artifacts 里。安装包不在每次推送时编：macOS 的运行时间按 10 倍计费，
# 私有仓库每月的免费额度经不起。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支连着推几次，只保留最新那次的测试；标签构建不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  script-tests:
    name: 脚本版测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 桌面额度与本地账号库依赖
        run: python -m pip install -r scripts/requirements-desktop.txt -r scripts/requirements-vault.txt
      - name: 脚本版测试（含 SHA256SUMS 是否最新）
        run: python -m unittest discover -s scripts -p "test_*.py"
        env:
          CAM_NO_KEYCHAIN: "1"

  engine-tests:
    name: Rust 引擎测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 引擎测试（含 tests/shared 与脚本版的一致性）
        run: cargo test -p cam-engine
      - name: 引擎 Rust 检查
        run: cargo clippy -p cam-engine --all-targets -- -D warnings -A clippy::too_many_lines

  frontend-check:
    name: 桌面版前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: 类型检查和前端打包
        run: npm run build

  desktop:
    name: 桌面版安装包（${{ matrix.platform }}）
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [script-tests, engine-tests, frontend-check]
    permissions:
      contents: write # 标签构建要创建 Release 草稿；新仓库的 GITHUB_TOKEN 默认只读
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          # ubuntu-22.04 的运行环境 2026 年 9 月起分批下线。在 24.04 上编出来的包要求 glibc 2.39 以上
          # （Ubuntu 24.04、Debian 13 及更新的系统才能装）
          - platform: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux 依赖
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 整个工作区的 Rust 检查（含桌面壳；只提示，不阻断构建）
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_lines

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Claude Accounts ${{ github.ref_name }}"
          releaseDraft: true

      - name: 上传安装包（手动构建）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-accounts-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: ignore
