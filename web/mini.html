<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 账号卡片</title>
<style>
/* 菜单栏小工具 / Windows 托盘点开的卡片小面板：380 宽，高度由插件按账号数算，内容多了整页上下滑。
   颜色、卡片、分段开关、标签、悬停说明和管理面板（web/panel.html）、桌面版是同一套；顶上一条红绿灯，下面“额度 / 用量”两个页签 */
:root {
  --paper: #F4F2EC; --surface: #FBFAF7; --line: #E7E3D9; --shadow: 0 1px 2px rgba(60, 45, 25, .05);
  --tile: var(--surface); --tile-line: var(--line); --tile-hover: #FFFFFF;
  --ink: #2E2C27; --muted: #6E6857; --track: #ECE8DE; --groove: #ECE8DE; --fill: #6E685A; --circle: #ECE8DE;
  --accent: #B5532F; --accent-ink: #FFFFFF; --on-hot: #FFFFFF; --accent-soft: #F0D8CC;
  --warn: #96600F; --hot: #B5432E; --live: #3B7A52; --violet: #7656B4; --ok: #3E6EA8;
  --live-soft: #E2EDDF; --warn-soft: #F5E8CF; --hot-soft: #F6E3DD; --ok-soft: #E0EAF6; --violet-soft: #EAE4F6;
  --c1: #B5532F; --c2: #3E6EA8; --c3: #2F8F4E; --c4: #7656B4; --c5: #C07A12; --c6: #1A8FB0;  /* 图表的分类色，和管理面板一样 */
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #262624; --surface: #2F2F2C; --line: #403F3B; --shadow: none; --tile-hover: #383835;
    --ink: #ECEAE3; --muted: #A39E91; --track: #3B3A36; --groove: #1F1F1D; --fill: #BDB7A8; --circle: #3B3A36;
    --accent: #D97757; --accent-ink: #1F1E1D; --on-hot: #1F1E1D; --accent-soft: #4A3328;
    --warn: #E0A548; --hot: #E8826F; --live: #6FBF8A; --violet: #B49AEF; --ok: #7FA6E0;
    --live-soft: #2C3B30; --warn-soft: #3E3421; --hot-soft: #42302A; --ok-soft: #27334A; --violet-soft: #362D4B;
    --c1: #C8653F; --c2: #5A8CDC; --c3: #45A868; --c4: #9879E0; --c5: #B98424; --c6: #2898B8; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 13px/1.45 var(--sans); font-variant-numeric: tabular-nums; padding: 10px; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
/* 竖着一列；弹窗按高的那个页签定高度，矮的那页按钮和页脚贴底 */
.grid { display: flex; flex-direction: column; gap: 8px; min-height: calc(100vh - 20px); }
.grid > *, .slot > * { flex: none; }
.glass { background: var(--tile); border: 1px solid var(--tile-line); box-shadow: var(--shadow); }
.slot { display: contents; }  /* 页面分块更新用的壳，不占格子 */
.tile { border-radius: 12px; padding: 12px 14px; }
/* 红绿灯：绿 = 空闲正常，黄 = 工作中 / 要注意 / 等你确认，红 = 要处理 */
.light { display: flex; align-items: center; gap: 9px; padding: 7px 12px 7px 11px; border-radius: 999px; font-size: 12px; }
.light .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--live); box-shadow: 0 0 0 3px var(--live-soft); }
.light.busy .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.light.bad .dot { background: var(--hot); box-shadow: 0 0 0 3px var(--hot-soft); }
.light.pulse .dot { animation: breathe 2s ease-in-out infinite; }  /* 有会话在跑：黄点一呼一吸，和菜单栏图标一个节奏 */
.light.ask .dot { animation: blink 1s step-end infinite; }  /* 等你确认切换：一亮一暗 */
.light.blink .dot { animation: blink .5s step-end infinite; }  /* Claude Code 在等你点 yes / no：快闪，和菜单栏三盏灯一个节奏 */
@keyframes breathe { 50% { box-shadow: 0 0 0 6px var(--warn-soft); transform: scale(1.12); } }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .light .dot { animation: none; } }
.light .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.light .more { flex: none; font-size: 10.5px; color: var(--muted); background: var(--circle); border-radius: 999px; padding: 1px 6px; }
.light.ask { flex-wrap: wrap; border-radius: 12px; padding: 9px 12px; }
.light.ask .txt { white-space: normal; flex-basis: calc(100% - 19px); line-height: 1.4; }
.light .btns { display: flex; gap: 6px; flex-basis: 100%; justify-content: flex-end; }
.light .btns button { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.light .btns button.go { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.light .btns button:disabled { opacity: .6; cursor: progress; }
/* 页签：额度 / 用量。和管理面板的页签、分段开关一个样子：底是一条浅槽，选中的是一块白底 */
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--groove); }
.tabs [role="tab"] { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: 13px; line-height: 1.5; padding: 4px 0; border-radius: 8px; cursor: pointer; }
.tabs [role="tab"]:hover { color: var(--ink); }
.tabs [role="tab"][aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(40, 30, 20, .14); }
.tabs [role="tab"]:focus-visible, .seg-mini button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg-mini { display: inline-flex; align-items: center; gap: 2px; border-radius: 8px; padding: 2px; background: var(--groove); flex: none; align-self: flex-start; }
.seg-mini button { border: 0; background: transparent; color: var(--muted); font-size: 12px; line-height: 1.5; padding: 2px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.seg-mini button:hover { color: var(--ink); }
.seg-mini button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(40, 30, 20, .14); }
.seg-mini button:disabled { cursor: progress; }
/* 额度环 */
.ring { display: block; }
.ring circle { fill: none; }
.ring .rt { stroke: var(--track); }
.ring .rf { stroke: var(--fill); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring .rf.warn { stroke: var(--warn); }
.ring .rf.hot { stroke: var(--hot); }
.ring text { fill: var(--ink); font: 650 12px var(--sans); }
.ring text tspan { font-size: 7.5px; font-weight: 600; }
/* 标签：套餐、状态，和管理面板一样的小方角 */
.chip { font-size: 10px; font-weight: 600; line-height: 1.5; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; flex: none; }
.chip.p-pro { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.p-max { background: var(--violet-soft); color: var(--violet); border-color: transparent; }
.chip.p-team { background: var(--live-soft); color: var(--live); border-color: transparent; }
.chip.bad { background: var(--hot); color: var(--on-hot); border-color: transparent; }
/* 改名：名字旁边的小铅笔，点了上面出一块输入框，下面一排昵称一键选 */
.pen { border: 0; background: var(--circle); color: var(--muted); border-radius: 999px; width: 20px; height: 20px; font-size: 12px; line-height: 20px; padding: 0; cursor: pointer; flex: none; }
.pen:hover { color: var(--ink); background: var(--tile-hover); }
.rn { display: flex; gap: 6px; align-items: center; }
.rn input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.rn button { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; }
.rn button.go { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rn button:disabled { opacity: .6; cursor: progress; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chips button { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.chips button:hover { border-color: var(--muted); }
.rn-tile .t { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
/* 有额度的号的汇总：5 小时、7 天平均已用；有号照现在的速度会在重置前用完时多一行提醒 */
.meter .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
.meter .lab b { color: var(--ink); font-size: 13px; font-weight: 650; }
.bar { position: relative; height: 6px; background: var(--track); border-radius: 999px; margin-top: 5px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--fill); min-width: 6px; }
.bar i.warn { background: var(--warn); }
.bar i.hot { background: var(--hot); }
.msum { padding: 10px 14px 11px; }
.msum .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 650; }
.msum .t span:last-child { font-size: 11px; color: var(--muted); font-weight: 600; }
.msum .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.msum .meter { margin-top: 6px; }
.msum .alert { margin-top: 8px; font-size: 11.5px; color: var(--warn); font-weight: 600; line-height: 1.4; }
/* 账号卡：一行两张。名字和套餐、几个会话在跑（当前号）、额度环（5 小时、7 天、用得最多的按模型周额度）各带重置时间、
   7 天节奏小线、一句结论、最下面到期。邮箱和更多细节在悬停说明里 */
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mc { display: flex; flex-direction: column; gap: 5px; min-width: 0; text-align: left; cursor: pointer; border-radius: 12px; padding: 10px 10px 9px;
  transition: border-color .12s, box-shadow .12s, transform .12s; outline: none; }
.mc:hover { border-color: var(--muted); box-shadow: 0 3px 10px rgba(40, 30, 20, .08); transform: translateY(-1px); }
.mc:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.mc.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mc.sel:hover { transform: none; }
.mc.off { opacity: .6; cursor: progress; transform: none; }
.mc .nm { display: flex; align-items: center; gap: 5px; min-width: 0; }
.mc .nm b { font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mc .nm .ok { color: var(--live); font-weight: 700; flex: none; }
.mc .nm .chip { margin-left: auto; font-size: 9.5px; padding: 0 5px; }
.mc .nm .pen { width: 18px; height: 18px; line-height: 18px; font-size: 11px; }
.mc .ss { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc .ss i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.mc .ss.busy { color: var(--warn); font-weight: 600; }
.mc .rr { display: flex; justify-content: space-around; gap: 2px; margin-top: 2px; }
.mc .rg { display: grid; justify-items: center; min-width: 0; text-align: center; line-height: 1.25; }
.mc .rg svg { margin-bottom: 2px; }
.mc .rg .rl { font-size: 10px; color: var(--muted); max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc .rg .rw { font-size: 10px; font-weight: 600; white-space: nowrap; letter-spacing: -.2px; }
.mc .sp svg { display: block; width: 100%; height: auto; overflow: visible; }
.mc .vd { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc .vd.warn, .mc .ex.warn { color: var(--warn); font-weight: 600; }
.mc .vd.hot, .mc .ex.hot { color: var(--hot); font-weight: 600; }
.mc .ex { margin-top: auto; padding-top: 5px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc .none { font-size: 11px; color: var(--muted); line-height: 1.4; padding: 6px 0; }
.mc .none svg { display: block; width: 22px; height: 22px; margin-bottom: 4px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* 用量页：这台电脑上 Claude Code 的记录（和管理面板“用量”页同一个接口）。四格数字、按小时 / 按天的叠起来的柱子、每个号一行 */
.utiles { display: grid; grid-template-columns: 1fr 1fr; border-radius: 12px; overflow: hidden; }
.utiles > div { padding: 9px 12px 10px; min-width: 0; }
.utiles > div:nth-child(2n) { border-left: 1px solid var(--line); }
.utiles > div:nth-child(n+3) { border-top: 1px solid var(--line); }
.utiles .k { font-size: 11.5px; color: var(--muted); }
.utiles .v { font-size: 19px; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.utiles .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.utiles .s.good { color: var(--live); }
.uchart { border-radius: 12px; padding: 10px 12px 8px; }
.uchart .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 600; }
.uchart .t span:last-child { font-size: 11px; font-weight: 400; color: var(--muted); }
.ubars { display: flex; align-items: flex-end; gap: 2px; height: 84px; margin-top: 8px; border-bottom: 1px solid var(--line); }
.ubars .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column-reverse; gap: 1px; cursor: default; }
.ubars .col i { display: block; width: 100%; flex: none; }
.ubars .col i:last-child { border-radius: 3px 3px 0 0; }
.ubars .col:hover { background: var(--groove); border-radius: 3px; }
.uaxis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 3px; }
.urows { margin-top: 6px; }
.ur { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 6px 0 5px; border-top: 1px solid var(--line); }
/* 会话页签：正在跑的 Claude Code 一行一个（项目、在干什么、上下文用了多少），点一下在管理面板的“会话”页看详情 */
.slist { border-radius: 12px; padding: 4px 0; }
.srow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 1px 8px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit;
  background: transparent; border: 0; border-top: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
.srow:first-child { border-top: 0; }
.srow:hover { background: var(--groove); }
.srow .led { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.srow .led.busy { background: var(--warn); animation: breathe 2s ease-in-out infinite; }
.srow .led.wait { background: var(--warn); animation: blink 1s step-end infinite; }
.srow b { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .pj { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.srow .ac { flex: none; max-width: 48%; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .st { font-size: 11px; color: var(--muted); white-space: nowrap; }
.srow .st.busy { color: var(--warn); font-weight: 600; }
.srow .sub { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); min-width: 0; }
.srow .sub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .bar { flex: 1; min-width: 40px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.srow .bar i { display: block; height: 100%; border-radius: 2px; background: var(--live); }
.srow .bar i.warn { background: var(--warn); }
.srow .bar i.hot { background: var(--hot); }
.srow .hl { font-weight: 600; }
.srow .hl.warn { color: var(--warn); }
.srow .hl.hot { color: var(--hot); }
@media (prefers-reduced-motion: reduce) { .srow .led { animation: none !important; } }
.ur .dot { width: 9px; height: 9px; border-radius: 3px; }
.ur .nm { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ur .val { font-weight: 650; font-size: 12.5px; }
.ur .tr { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.ur .tr i { display: block; height: 100%; border-radius: 2px; }
.ur .sub { grid-column: 2 / 4; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 悬停说明：账号上（邮箱、套餐和到期、各个额度窗口、用量什么时候取的、最近切换）、用量柱子上。和管理面板的提示一个样子 */
.tip { position: fixed; z-index: 8; width: 240px; padding: 9px 12px; border-radius: 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  box-shadow: 0 6px 22px rgba(40, 30, 20, .16); font-size: 11.5px; line-height: 1.45; pointer-events: none; }
.tip .t { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; padding-bottom: 5px; margin-bottom: 5px; border-bottom: 1px solid var(--line); min-width: 0; }
.tip .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; margin: 0; }
.tip dt { color: var(--muted); white-space: nowrap; }
.tip dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tip dd.hot { color: var(--hot); font-weight: 600; }
.tip dd.warn { color: var(--warn); font-weight: 600; }
.tip .do { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.tip .tl { display: flex; align-items: center; justify-content: space-between; gap: 12px; line-height: 1.7; }
.tip .tl span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip .tl i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tip .tl b { font-weight: 650; white-space: nowrap; }
.tip .tl.total { margin-top: 3px; padding-top: 4px; border-top: 1px dashed var(--line); }
.tip .tl.total span { color: var(--ink); }
/* 底下一排圆按钮，像控制中心的那种 */
.acts { display: flex; justify-content: center; gap: 18px; margin: auto 0 2px; padding-top: 4px; }
.act { display: grid; justify-items: center; gap: 4px; background: none; border: 0; cursor: pointer; color: var(--ink); padding: 0; }
.act .circle { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; transition: border-color .12s, transform .12s; }
.act:hover .circle { border-color: var(--muted); transform: translateY(-1px); }
.act:disabled { cursor: progress; opacity: .6; }
.act svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act span { font-size: 11px; color: var(--muted); }
/* 设置页：真正的开关和分段选择，像系统设置 */
.set { display: grid; gap: 2px; }
.set .row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); }
.set .row:first-child { border-top: 0; padding-top: 2px; }
.set .lab { flex: 1; min-width: 0; }
.set .lab b { display: block; font-size: 13px; font-weight: 600; }
.set .lab span { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
.sw { position: relative; width: 44px; height: 26px; flex: none; }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--track); transition: background .15s; cursor: pointer; }
.sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.sw input:checked + i { background: var(--live); }
.sw input:checked + i::after { transform: translateX(18px); }
.sw input:disabled + i { opacity: .5; cursor: progress; }
.set .hint { font-size: 11px; color: var(--muted); padding: 6px 2px 0; }
.set .hint a { color: var(--accent); }
.foot { display: flex; justify-content: space-between; gap: 8px; margin: 2px 6px 0; font-size: 11px; color: var(--muted); }
.foot .risk.medium { color: var(--warn); }
.foot .risk.high { color: var(--hot); font-weight: 600; }

  async function loadSettings() {

  function renameForm(a) {
    const used = new Set(state.accounts.filter((x) => x.id !== a.id).map((x) => x.label));
    const plan = PLAN[a.plan_display];
    const sug = [...(plan && plan !== "API" ? [`${plan}号`] : []), ...NICKS].filter((n) => !used.has(n)).slice(0, 6);

      <div class="chips">${sug.map((n) => `<button type="button" data-nick="${esc(n)}">${esc(n)}</button>`).join("")}</div>`;
  }

  // ms：这么久没回应就放弃。只给定时读取的接口用：后端卡住、电脑睡醒后连接半断时，那一次请求不结束，后面的定时刷新就全被它挡住了

      res = await fetch(path, { method, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },

    return `${Math.floor(h / 24)} 天 ${h % 24} 小时`;
  }
  function resetShort(iso) {

  }
  const passed = (w) => !!(w && w.resets_at && new Date(w.resets_at) <= Date.now());  // 窗口早该重置了：存着的数字是旧的，刷新一次才知道现在多少
  const noReset = (p) => (p === 0 ? "还没开始用，不计时" : "重置时间未知");  // 接口没给重置时间：0% 是这个窗口还没开始（第一条消息才开始计时），不是不知道

  function dueInfo(a) {  // 和管理面板一个说法：7 天内提醒，2 天内和过期的标红
    const d = a.days_left;

  const cpLen = (s) => [...String(s || "")].length;
  // 和菜单栏插件一个规则：名字是邮箱、没有名字或太宽（汉字算 2、字母算 1，超过 12）时显示成“1号”这样的序号（按添加顺序，和快捷键的数字一致）

  const needsNumber = (a) => !a.label || a.label.includes("@") || width(a.label) > 12;
  const nameOf = (a, pos) => needsNumber(a) ? `${pos[a.id]}号` : a.label;
  function ring(p, size, stroke) {
    const r = size / 2 - stroke / 2 - 1, c = 2 * Math.PI * r, v = p === null ? 0 : p;
    // 小环（34 px）里的字小一号，“100%”再小一号，不贴到圈上

  async function loadPace() {
    if (document.hidden) return;

  }
  // 今天“19:00”，明天“明天 09:00”，一周内“周日 14:00”，再远“11-28 09:00”。t 是秒或 ISO 时间
  function whenShort(t) {

  // 卡片上的额度环：5 小时、7 天，再加用得最多的那个按模型的周额度（如 Fable）；窗口早该重置了的不画（存着的是旧数字）
  function quotaRings(a) {
    const u = a.usage || {}, out = [];

  const ringBox = (r) => `<span class="rg">${ring(r.p, 34, 3.5)}<span class="rl">${esc(r.label)}</span><span class="rw">${esc(r.w.resets_at ? whenShort(r.w.resets_at) : r.p === 0 ? "未开始" : "–")}</span></span>`;
  // 一句结论：用满了几点恢复 / 按现在的速度什么时候用完 / 够用

    const u = a.usage || {}, p = a.pace, full = (w) => pct(w) !== null && w.utilization >= FULL_AT && !passed(w);
    if (full(u.five_hour)) return { cls: "hot", text: `5 小时用满${u.five_hour.resets_at ? ` · ${whenShort(u.five_hour.resets_at)} 恢复` : ""}` };
    const m = (u.models || []).find(full);

  // 到期：3 天内标黄、过了标红、自动续期写每月几号；没记到期日不显示

    const ok = !isNaN(t), date = ok ? `${pad(t.getMonth() + 1)}-${pad(t.getDate())}` : "";

    if (d < 0) return { cls: "hot", text: `已过到期日${date ? `（${date}）` : ""}` };

  function paceSvg(a) {

    const ink = p.state === "out" || p.state === "full" ? "var(--warn)" : "var(--fill)";
    let s = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`;

  function planChip(a) {

  // 红绿灯：按严重程度排，只显示最要紧的一条，其余在悬停提示里
  function lightHtml(cur, pos) {
    const items = [];

    const p5 = pct(u.five_hour), p7 = pct(u.seven_day);
    const ss = state.sessions || {}, n = ss.count === undefined ? null : ss.count, pend = state.pending_switch;
    if (state.warning) items.push({ lv: "bad", text: state.warning });
    if (h.level === "error") items.push({ lv: "bad", text: `当前号${issue.text ? "：" + issue.text : "有问题"}`, tip: issue.advice });
    if (p5 !== null && p5 >= 100) items.push({ lv: "bad", text: `5 小时额度用完了，${resetShort(u.five_hour.resets_at)}` });
    if (ask && ask.confirm) items.push({ lv: "busy", ask: true, text: `切换到 ${ask.label}？`, btns: [["ask-go", "切换", "go"], ["ask-no", "取消"]] });  // 设置里开了“切换前确认”

          <span>${ktok(r.context_used)} / ${ktok(r.context_window)}</span>${h ? `<span class="hl ${h[1]}">${h[0]}</span>` : ""}</span></button>`;
    };
    const t = `${rows.length} 个会话${sess.answering ? ` · ${sess.answering} 个在回答` : ""}${sess.waiting ? ` · ${sess.waiting} 个等你确认` : ""}`;
    return `<div class="tile glass msum"><div class="t"><span>${t}</span><span>上下文</span></div></div><div class="slist glass">${rows.map(row).join("")}</div>`;
  }
  // claude-opus-4-1-20250805 → Opus 4.1（和管理面板一样）
  function modelName(m) {
    const s = String(m || "").replace(/^.*?claude-/, "").replace(/-\d{8}$/, "");
    const parts = s.split("-"), fam = parts.filter((p) => /^[a-z]+$/i.test(p)), ver = parts.filter((p) => /^\d+$/.test(p));
    if (!fam.length) return m || "未知模型";
    return fam.map((f) => f[0].toUpperCase() + f.slice(1)).join(" ") + (ver.length ? " " + ver.join(".") : "");
  }
  async function loadSessions() {
    if (document.hidden || mtab !== "sessions") return;
    try { sess = await api("GET", "/api/sessions", undefined, 20000); sessErr = false; } catch (_) { sessErr = true; }
    render();
  }
  async function loadUsage() {  // 要扫日志文件，比 /api/state 慢：只在“用量”页签开着、弹窗显示时要
    if (document.hidden || mtab !== "usage") return;
    const want = urange;
    try {
      const r = await api("GET", `/api/local-usage?range=${want}`, undefined, 30000);
      if (want === urange) { usage = r; usageErr = false; }
    } catch (_) { if (want === urange) usageErr = true; }
    render();
  }
  function pickTab(v, focus) {
    if (v === mtab || !MTABS.some(([x]) => x === v)) return;
    mtab = v; lsPut("cam-mini-tab", v);
    hideTip(); render();
    if (focus) { const b = document.querySelector(`[data-mtab="${v}"]`); if (b) b.focus(); }
    loadUsage(); loadSessions();
  }
  function render() {
    if (!state) return;
    if (renaming && $(".rn")) { syncMsg(); applyBusy(); return; }  // 改名表单开着时不重画（会丢输入），只更新按钮状态和提示
    const accs = state.accounts || [];
    if (!accs.length) return paint({ cards: `<div class="tile glass empty">还没有账号<br>终端运行 <code>cam import --label 工作号</code> 存下现在登录的号</div>` });
    const pos = Object.fromEntries(accs.map((a, i) => [a.id, i + 1]));
    const acts = `<div class="acts"><button class="act" data-act="refresh"><span class="circle glass">${ICON.refresh}</span><span>刷新用量</span></button>
          <button class="act" data-act="panel"><span class="circle glass">${ICON.panel}</span><span>管理面板</span></button>
          <button class="act" data-act="settings"><span class="circle glass">${ICON.gear}</span><span>设置</span></button></div>`;
    // 卡片只放 Claude Code 的号和桌面版的号（网页号、API 号在管理面板里），一行两张：当前的 Claude Code 号排第一，其余 Code 号，然后桌面号。
    // 和插件 mini_size 算高度的规则一致
    const code = accs.filter((a) => a.kind === "claude_code"), desks = accs.filter((a) => a.kind === "claude_desktop");
    const list = [...code.filter((a) => a.is_active), ...code.filter((a) => !a.is_active), ...desks];
    if (!list.length) return paint({ cards: `<div class="tile glass empty">卡片只放 Claude Code 和 Claude 桌面版的号<br>网页号、API 号在管理面板里</div>`, acts, set: settingsHtml() });
    const cur = code.find((a) => a.is_active) || code[0] || desks[0];
    // 汇总：有额度的号的 5 小时、7 天平均已用；有号照现在的速度会在重置前用完时多一句
    const q = list.map((a) => [a, quotaRings(a)]).filter(([, r]) => r.length);
    const outs = list.filter((a) => a.pace && a.pace.state === "out");
    const avg = (lab) => { const v = q.map(([, r]) => r.find((x) => x.label === lab)).filter(Boolean).map((x) => x.p); return v.length ? v.reduce((n, x) => n + x, 0) / v.length : null; };
    const sm = (label, v) => v === null ? "<div></div>" : `<div class="meter"><div class="lab"><span>${label}</span><b>${v.toFixed(0)}%</b></div><div class="bar"><i class="${lv(v)}" style="width:${v}%"></i></div></div>`;
    const sum = q.length >= 2 || outs.length ? `<div class="tile glass msum"><div class="t"><span>有额度的 ${q.length} 个号</span><span>平均已用</span></div>
      <div class="two">${sm("5 小时", avg("5h"))}${sm("7 天", avg("7d"))}</div>${outs.length ? `<div class="alert">⚠ ${esc(nameOf(outs[0], pos))} ${esc(verdict(outs[0]).text)}${outs.length > 1 ? `，另外 ${outs.length - 1} 个号也是` : ""}</div>` : ""}</div>` : "";
    const ss = state.sessions || {};
    const mc = (a) => {
      const hh = a.health || {}, nm = nameOf(a, pos), desk = a.kind === "claude_desktop", on = !desk && a.is_active;
      const rings = quotaRings(a), v = verdict(a), ex = expiry(a);
      const what = [ss.answering ? `${ss.answering} 个在回答` : ss.busy ? "正在回答" : "", ss.waiting ? `${ss.waiting} 个等你确认` : ""].filter(Boolean).join(" · ");
      const sess = on && ss.count > 0 ? `<span class="ss${ss.busy || ss.waiting ? " busy" : ""}"><i></i>${ss.count} 个会话${ss.busy || ss.waiting ? "在跑 · " + what : "开着 · 空闲"}</span>` : "";
      const body = rings.length ? `<span class="rr">${rings.map(ringBox).join("")}</span>${a.pace ? `<span class="sp">${paceSvg(a)}</span>` : ""}`
        : `<span class="none">${desk ? ICON.desktop : ""}${hh.level === "error" ? esc(((hh.issues || [])[0] || {}).text || "登录有问题") : desk ? `桌面版${deskState(a) ? " · " + esc(deskState(a)) : ""}<br>还没有本地额度` : "还没有用量，点下面的刷新"}</span>`;
      const tail = v ? `<span class="vd ${v.cls}">${esc(v.text)}</span>` : on ? "" : `<span class="vd">${desk ? "点一下打开" : "点一下切换"}</span>`;
      return `<div class="mc glass${on ? " sel" : ""}" role="button" tabindex="0" aria-label="${esc(nm)}${on ? "（正在用）" : desk ? "：打开桌面版" : "：切换到这个号"}"
        data-id="${esc(a.id)}" data-kind="${esc(a.kind)}" data-name="${esc(nm)}" data-tip="${esc(a.id)}"${on ? ' data-on="1"' : ""}>
        <span class="nm">${on ? '<span class="ok">✓</span>' : ""}<b>${esc(nm)}</b>${on ? `<button type="button" class="pen" data-act="rename" data-id="${esc(a.id)}" title="改名">✎</button>` : ""}${hh.level === "error" ? `<span class="chip bad">异常</span>` : planChip(a)}</span>
        ${sess}${body}${tail}${ex ? `<span class="ex ${ex.cls}">${esc(ex.text)}</span>` : ""}</div>`;
    };
    const rn = renaming && list.some((a) => a.id === renaming) ? `<div class="tile glass rn-tile"><div class="t">给 ${esc(nameOf(list.find((a) => a.id === renaming), pos))} 改名：菜单栏、命令行、聊天机器人里都用这个名字</div>${renameForm(list.find((a) => a.id === renaming))}</div>` : "";
    const sc = state.risk_score, reg = state.region || {};
    // 最近一次环境检测没连上：留着的是上一次查到的出口，标一个问号（详情在管理面板的环境区块）
    const left = (reg.loc ? `<span${reg.failed_at ? ` title="最近一次环境检测没连上，这是${ago(reg.checked_at)}查到的"` : ""}>出口 ${esc(reg.loc)}${reg.failed_at ? " ?" : reg.status === "supported" ? " ✓" : reg.status === "unsupported" ? " ⚠" : ""}</span>` : "")
      + (sc && reg.status ? `${reg.loc ? " · " : ""}<span class="risk ${esc(sc.grade)}">环境 ${esc(sc.score)}/100</span>` : "");
    const foot = `<div class="foot"><span>${left}</span><span>${state.generated_at ? "更新 " + new Date(state.generated_at).toTimeString().slice(0, 5) : ""}</span></div>`;
    const quota = mtab === "quota";
    paint({ light: lightHtml(cur, pos), tabs: tabsHtml(), rn, sum: quota ? sum : "", cards: quota ? `<div class="mgrid">${list.map(mc).join("")}</div>` : "",
      usage: mtab === "usage" ? usageHtml(pos) : mtab === "sessions" ? sessionsHtml() : "", acts, set: settingsHtml(), foot });
  }
  let loading = null, loadedAt = 0, stamp = null;
  function load() {  // 点开弹窗时 focus、pageshow、visibilitychange 会连着触发：同一时间只发一个请求，刚取过的不再取
    if (loading) return loading;
    if (Date.now() - loadedAt < 1500) return Promise.resolve();
    loading = (async () => {
      try {
        state = await api("GET", "/api/state", undefined, 15000); loadedAt = Date.now();
        if (stamp && state.code_stamp && state.code_stamp !== stamp) { location.reload(); return; }  // 弹窗常驻：代码更新、cam serve 换了新版后整页重新加载一次
        stamp = state.code_stamp || stamp;
        render();
      }
      catch (e) { $("#main").innerHTML = `<div class="tile glass empty">连不上后端：${esc(e.message)}<br>确认 cam serve 还在运行</div>`; }
      finally { loading = null; }
    })();
    return loading;
  }
  function say(text, cls) {  // 成功的提示 2.5 秒，出错的 6 秒
    msg = text ? { text, cls: cls || "" } : null;
    render();
    if (text) setTimeout(() => { if (msg && msg.text === text) { msg = null; render(); } }, cls === "bad" ? 6000 : 2500);
  }
  async function run(fn) {
    if (busy) return;
    busy = true; render();
    try { await fn(); } catch (e) { say(e.message, "bad"); }
    finally { busy = false; render(); }
  }
  async function switchTo(id, mode) {
    const r = await api("POST", `/api/accounts/${encodeURIComponent(id)}/switch`, mode ? { mode } : {});
    if (r.choice_required) { ask = { id, label: r.label, running: r.running_claude }; return; }  // 有会话在跑：红绿灯那里问怎么切
    ask = null;
    state = await api("GET", "/api/state");
    say(r.message, r.deferred || !r.changed ? "wait" : "");
  }
  // 桌面号：要退出并重启 Claude 桌面版，先在红绿灯那里问一句，点了“打开”才做
  function openAcc(id, kind, name, now) {
    if (busy) return;
    if (!now) { ask = { open: id, label: name }; render(); return; }
    return run(async () => {
      const r = await api("POST", `/api/accounts/${encodeURIComponent(id)}/open`);
      ask = null;
      say(r.message || "已打开");
    });
  }
  document.addEventListener("keydown", (ev) => {
    const tb = ev.target.closest && ev.target.closest("[data-mtab]");  // 页签：左右方向键换
    if (tb && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")) {
      ev.preventDefault();
      const i = MTABS.findIndex(([v]) => v === mtab), j = (i + (ev.key === "ArrowRight" ? 1 : -1) + MTABS.length) % MTABS.length;
      return pickTab(MTABS[j][0], true);
    }
    const card = ev.target.closest && ev.target.closest(".mc");
    if (card && ev.target === card && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); card.click(); }
  });
  document.addEventListener("click", (ev) => {
    const tb = ev.target.closest("[data-mtab]");
    if (tb) return pickTab(tb.dataset.mtab);
    const ur = ev.target.closest("[data-urange]");
    if (ur) {
      if (ur.dataset.urange !== urange) { urange = ur.dataset.urange; lsPut("cam-mini-range", urange); render(); loadUsage(); }
      return;
    }
    const acc = ev.target.closest("[data-act]") ? null : ev.target.closest(".mc");
    if (acc) {
      const { id, kind, name } = acc.dataset;
      if (busy || acc.dataset.on) return;  // 正在用的号：点了不做事（改名点 ✎）
      if (kind !== "claude_code") return openAcc(id, kind, name);
      // 设置里开了“切换前确认”：先在红绿灯那里问一句。有会话在跑时不多问一遍，switchTo 本来就会问怎么切
      if (settings && settings.confirm_switch && !(state && state.sessions && state.sessions.count > 0)) {
        if (!busy) { ask = { id, label: name, confirm: true }; render(); }
        return;
      }
      return run(() => switchTo(id));
    }
    const ic = ev.target.closest("[data-icon]");  // 设置页里的图标样式分段按钮（没有 data-act，要在下面那句 return 之前处理）
    if (ic) {
      if (settings && !busy && ic.dataset.icon !== settings.icon) run(async () => { settings = await api("PUT", "/api/menubar", { icon: ic.dataset.icon }); say("已切换"); });
      return;
    }
    const btn = ev.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === "refresh") run(async () => { state = await api("POST", "/api/refresh", {}); say("用量已刷新"); loadUsage(); loadPace(); });
    // 管理面板打开到对应的页签：在“用量”这边点就开到“用量”页
    if (act === "panel") run(async () => { await api("POST", "/api/open-panel", { tab: mtab === "quota" ? "accounts" : mtab }); say("已打开"); });
    if (act === "open-session") run(async () => { await api("POST", "/api/open-panel", { tab: "sessions" }); say("已在管理面板打开"); });
    if (act === "ask-go" && ask && ask.confirm) run(() => switchTo(ask.id));  // 确认后照常切；这时发现有会话在跑，switchTo 会接着问怎么切
    if (act === "ask-wait" && ask && ask.id) run(() => switchTo(ask.id, "wait"));
    if (act === "ask-now" && ask && ask.id) run(() => switchTo(ask.id, "now"));
    if (act === "ask-no") { ask = null; render(); }
    if (act === "open") openAcc(btn.dataset.id, btn.dataset.kind, btn.dataset.name);
    if (act === "open-now" && ask && ask.open) openAcc(ask.open, "claude_desktop", ask.label, true);
    if (act === "pend-now" && state.pending_switch) run(() => switchTo(state.pending_switch.account, "now"));
    if (act === "pend-cancel") run(async () => { state = await api("DELETE", "/api/pending-switch"); say("已取消", "wait"); });
    if (act === "settings") { showSettings = !showSettings; render(); if (showSettings) loadSettings(); }
    if (act === "set-close") { ev.preventDefault(); showSettings = false; render(); }
    if (act === "rename") { renaming = btn.dataset.id; render(); const i = $(".rn input"); if (i) { i.focus(); i.select(); } }
    if (act === "rn-cancel") { renaming = null; render(); }
  });
  document.addEventListener("click", (ev) => {  // 昵称一键选：填进输入框，自己点保存
    const b = ev.target.closest("[data-nick]"), i = $(".rn input");
    if (b && i) { i.value = b.dataset.nick; i.focus(); }
  });
  document.addEventListener("change", (ev) => {
    const cf = ev.target.closest('[data-set="confirm"]');
    if (cf && settings) {
      const on = cf.checked;
      run(async () => { settings = await api("PUT", "/api/menubar", { confirm_switch: on }); say(on ? "已打开：点卡片先问一句再切" : "已关闭：点卡片直接切"); });
      return;
    }
    const hk = ev.target.closest('[data-set="hooks"]');
    if (hk && settings) {
      const on = hk.checked;
      run(async () => { settings = await api("PUT", "/api/menubar", { hooks: on }); say(on ? "已装钩子：Claude Code 等你确认时三盏灯一起闪（正在跑的 claude 重开后生效）" : "已去掉钩子"); });
      return;
    }
    const sw = ev.target.closest('[data-set="mode"]');
    if (!sw || !settings) return;
    const mode = sw.checked ? "stream" : "classic";
    run(async () => {
      say("正在切换…", "wait");
      settings = await api("PUT", "/api/menubar", { mode });
      say(settings.restarting ? "已切换" : "没有变化");
    });
  });
  document.addEventListener("submit", (ev) => {
    const f = ev.target.closest(".rn");
    if (!f) return;
    ev.preventDefault();
    const label = f.label.value.trim(), id = f.dataset.id;
    if (!label) return;
    run(async () => {
      state = await api("PATCH", `/api/accounts/${encodeURIComponent(id)}`, { label });
      renaming = null;
      say("已修改");
    });
  });
  load().then(() => { loadPace(); loadUsage(); });  // 先把账号和额度画出来，再要节奏线的点和本机记录（用量页签开着时）
  loadSettings();  // “切换前确认”开关点卡片时就要用，一开始就读（设置页没打开时 render 不画它）
  setInterval(() => { if (!document.hidden) load(); }, 30000);  // 弹窗可能一直留着（SwiftBar 默认复用 webview），定时刷新
  setInterval(loadUsage, 120000);
  setInterval(loadSessions, 10000);  // 会话页签开着时每 10 秒（没开着时 loadSessions 直接返回）
  setInterval(loadPace, 300000);
  window.addEventListener("focus", () => load());
  window.addEventListener("pageshow", () => load());
  document.addEventListener("visibilitychange", () => {  // 弹窗常驻：收起时藏掉悬停说明，再点开时刷新数据
    if (document.hidden) { hideTip(); return; }
    load();
    if (mtab === "usage") loadUsage();
    if (mtab === "sessions") loadSessions();
  });
})();
</script>
</body>
